[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-fin_auditor"
version = "0.1.0"
description = "Fin Auditor environment for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.2.3",
    "openenv-core[core]>=0.2.2",
    "numpy",
    "nanobind",
    "openai",
    "pydantic",
    "fastapi",
    "uvicorn",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.2",
    "stable-baselines3[extra]>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
# Server entry point - enables running via: uv run --project . server
# or: python -m fin_auditor.server.app
server = "fin_auditor.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["fin_auditor", "fin_auditor.server"]
package-dir = { "fin_auditor" = ".", "fin_auditor.server" = "server" }
